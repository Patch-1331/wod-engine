name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories published after a PR merges still surface.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # Secret scanning over the full git history. Runs the gitleaks binary
  # directly rather than a third-party action, so this job stays within the
  # repository's "GitHub-owned and verified actions only" policy.
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks needs history, not just the tip commit.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: gitleaks git --no-banner --redact --verbose -c .gitleaks.toml .

  # Fails a PR that introduces a dependency with a known advisory, before it
  # lands. Complements Dependabot, which only reports what is already merged.
  # Requires the dependency graph, which is available on public repositories.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Static analysis for injection, XSS, unsafe deserialisation and similar.
  # Free on public repositories; on a private repository this job will not run.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3

  # `npm audit` on production dependencies only. Dev-only advisories are noisy
  # and do not ship to users.
  #
  # Non-blocking for now: the known react-router advisories (#82) would
  # otherwise fail every PR, including the one that fixes them. Remove
  # `continue-on-error` once #82 lands, so this becomes a real gate.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
