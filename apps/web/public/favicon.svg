<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Regimen Works: a nixie tube seated in an instrument panel.
       Follows DESIGN.md's two-layer rule — the tube glows because it
       reports a live quantity; the socket is engraved and never lights. -->
  <defs>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc184"/>
      <stop offset="0.5" stop-color="#ff9130"/>
      <stop offset="1" stop-color="#d0690f"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#120c07"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="#1c140d" stroke="#3a2c1c" stroke-width="1.5"/>

  <!-- glow cast onto the panel -->
  <rect x="10" y="4" width="12" height="18" rx="6" fill="#ff9130" opacity="0.5" filter="url(#g)"/>

  <!-- the tube -->
  <rect x="10" y="4" width="12" height="18" rx="6" fill="url(#t)"/>
  <rect x="12" y="6.5" width="2.8" height="10" rx="1.4" fill="#fff3e2" opacity="0.5"/>

  <!-- engraved socket: never glows -->
  <rect x="8" y="23.4" width="16" height="4.4" rx="1.6" fill="#c4b7a2"/>
</svg>
