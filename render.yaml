# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Create via the Render dashboard: New -> Blueprint -> pick this repo. Render
# reads this file from the selected branch and syncs on every push that
# changes it. Services created by hand in the dashboard are NOT adopted by a
# blueprint; they have to be re-created from here.
#
# Region must match between the web service and the database, otherwise the
# service can't reach the database over its internal connection string.

databases:
  - name: wod-engine-db
    databaseName: wod_engine
    user: wod_engine
    # Not free: free databases expire 30 days after creation and are deleted
    # after a 14-day grace period, taking all data with them. $6/month.
    plan: 0.1c-256mb
    region: ohio
    # Block all external connections. The allow list governs only the external
    # URL; wod-engine-api reaches the database over the internal URL, which
    # ignores it, as do Render's backups, PITR and the dashboard psql shell.
    # Render's default is 0.0.0.0/0 — open to the whole internet with only the
    # password in the way. The cost of this is that a local psql or GUI client
    # can no longer reach it; add a CIDR back here to restore that:
    #   ipAllowList:
    #     - source: "203.0.113.4/32"
    #       description: "home"
    ipAllowList: []

services:
  - type: web
    name: wod-engine-api
    runtime: node
    region: ohio
    # Free web services spin down after ~15 minutes idle, and the next request
    # pays a cold start before the app's own ~5s boot. $7/month. Note the plan
    # id: Render renamed instance types to compute plans, and "starter" is no
    # longer an accepted value.
    plan: 0.5c-512mb
    branch: main
    # Install at the repo root: this is an npm workspaces monorepo and
    # apps/api depends on @wod-engine/shared, so apps/api can't install alone.
    rootDir: .
    # prisma generate is explicit because the root postinstall only builds
    # packages/shared, and @prisma/client's own postinstall doesn't reliably
    # find apps/api/prisma/schema.prisma through a hoisted workspace install.
    buildCommand: >-
      npm ci &&
      npm run prisma:generate --workspace apps/api &&
      npm run build
    # Runs after the build succeeds but before the new instance starts, on a
    # throwaway instance of its own; the paid plan above is what makes it
    # available. A non-zero exit fails the whole deploy, so a bad migration
    # never reaches startCommand and the current instance keeps serving.
    # This is why migrations don't belong in buildCommand: a build runs to
    # completion even when its deploy is never promoted — superseded by a
    # newer commit, cancelled, or failed afterwards — so the schema changed
    # under code that never shipped. Pre-deploy only runs for a deploy that is
    # actually going out.
    # healthCheckPath is evaluated against the new instance after startCommand,
    # strictly later than this, so the app is only probed once the schema it
    # expects is in place.
    # The seed is idempotent (upserts throughout, and skillLevel updates to a
    # no-op so re-seeding never resets progress), so it's safe on every deploy.
    # Without it migrate deploy leaves empty tables and the scheduler has no
    # exercises or schedule rule to build a WOD from.
    # Run through the workspace, not `npx prisma ... --schema <path>` from the
    # root: Prisma 7 takes the connection string from apps/api/prisma.config.ts,
    # and it only finds that file when apps/api is the working directory. From
    # the root it fails with "datasource.url property is required".
    preDeployCommand: >-
      npm run prisma:migrate:deploy --workspace apps/api &&
      npm run prisma:seed --workspace apps/api
    # Not dist/main: prisma/seed.ts sits inside the compile scope, so nest
    # build emits to dist/src/ rather than flattening to dist/.
    startCommand: node apps/api/dist/src/main
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wod-engine-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # Clerk verifies session tokens with this. Unlike the shared secret it
      # replaces, it is not generatable — paste the production instance's
      # secret key from dashboard.clerk.com. The service refuses to boot
      # without it, so it can never serve unauthenticated.
      - key: CLERK_SECRET_KEY
        sync: false
      # CORS allowlist. Set to the wod-engine-web origin once Render assigns
      # it — the frontend calls this API cross-origin, so an unset value falls
      # back to the Vite dev server and the deployed site is refused.
      - key: WEB_ORIGIN
        sync: false

  # Static frontend. Served from Render's CDN, which is free at any scale — it
  # needs no compute plan of its own.
  - type: web
    name: wod-engine-web
    runtime: static
    branch: main
    rootDir: .
    # Only the web workspace: npm ci already builds packages/shared via the
    # root postinstall, and the API is a separate service.
    buildCommand: npm ci && npm run build --workspace apps/web
    staticPublishPath: ./apps/web/dist
    routes:
      # React Router owns the paths. Without this, a refresh or a shared link
      # to /history asks the CDN for a file that does not exist and 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite inlines these at build time, so both are baked into the bundle.
      # That is correct for a publishable key and for a public API URL; never
      # put a secret here.
      # Set to the API's full origin, e.g. https://wod-engine-api.onrender.com
      # — fromService could supply the host, but not the scheme, and this value
      # is used as a URL prefix.
      - key: VITE_API_BASE_URL
        sync: false
      # Clerk's publishable key for the instance this frontend signs in
      # against. Public by design, but instance-specific, so it is set rather
      # than committed — pk_test_ for development, pk_live_ for production.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
