# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Create via the Render dashboard: New -> Blueprint -> pick this repo. Render
# reads this file from the selected branch and syncs on every push that
# changes it. Services created by hand in the dashboard are NOT adopted by a
# blueprint; they have to be re-created from here.
#
# Region must match between the web service and the database, otherwise the
# service can't reach the database over its internal connection string.

databases:
  - name: wod-engine-db
    databaseName: wod_engine
    user: wod_engine
    plan: free
    region: ohio

services:
  - type: web
    name: wod-engine-api
    runtime: node
    region: ohio
    plan: free
    branch: main
    # Install at the repo root: this is an npm workspaces monorepo and
    # apps/api depends on @wod-engine/shared, so apps/api can't install alone.
    rootDir: .
    # prisma generate is explicit because the root postinstall only builds
    # packages/shared, and @prisma/client's own postinstall doesn't reliably
    # find apps/api/prisma/schema.prisma through a hoisted workspace install.
    # migrate deploy belongs in preDeployCommand, but that's a paid-plan
    # feature; on free it runs here, which is fine for a single instance.
    # The seed is idempotent (upserts throughout, and skillLevel updates to a
    # no-op so re-seeding never resets progress), so it's safe on every deploy.
    # Without it migrate deploy leaves empty tables and the scheduler has no
    # exercises or schedule rule to build a WOD from.
    buildCommand: >-
      npm ci &&
      npm run prisma:generate --workspace apps/api &&
      npm run build &&
      npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
      npm run prisma:seed --workspace apps/api
    # Not dist/main: prisma/seed.ts sits inside the compile scope, so nest
    # build emits to dist/src/ rather than flattening to dist/.
    startCommand: node apps/api/dist/src/main
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wod-engine-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # Clerk verifies session tokens with this. Unlike the shared secret it
      # replaces, it is not generatable — paste the production instance's
      # secret key from dashboard.clerk.com. The service refuses to boot
      # without it, so it can never serve unauthenticated.
      - key: CLERK_SECRET_KEY
        sync: false
      # CORS allowlist. Set to the wod-engine-web origin once Render assigns
      # it — the frontend calls this API cross-origin, so an unset value falls
      # back to the Vite dev server and the deployed site is refused.
      - key: WEB_ORIGIN
        sync: false

  # Static frontend. Served from Render's CDN, so unlike the API it does not
  # spin down on the free plan.
  - type: web
    name: wod-engine-web
    runtime: static
    branch: main
    rootDir: .
    # Only the web workspace: npm ci already builds packages/shared via the
    # root postinstall, and the API is a separate service.
    buildCommand: npm ci && npm run build --workspace apps/web
    staticPublishPath: ./apps/web/dist
    routes:
      # React Router owns the paths. Without this, a refresh or a shared link
      # to /history asks the CDN for a file that does not exist and 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite inlines these at build time, so both are baked into the bundle.
      # That is correct for a publishable key and for a public API URL; never
      # put a secret here.
      # Set to the API's full origin, e.g. https://wod-engine-api.onrender.com
      # — fromService could supply the host, but not the scheme, and this value
      # is used as a URL prefix.
      - key: VITE_API_BASE_URL
        sync: false
      # Clerk's publishable key for the instance this frontend signs in
      # against. Public by design, but instance-specific, so it is set rather
      # than committed — pk_test_ for development, pk_live_ for production.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
